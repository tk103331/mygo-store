name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)*$ ]]; then
            echo "::error::Tag $TAG must look like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Compose the release notes
        run: |
          previous="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          {
            echo "## MyGo Store ${TAG}"
            echo
            echo "原生 MyGo 应用市场，支持 macOS、Windows 和 Linux。"
            echo
            echo "### 下载"
            echo "- **macOS**（Apple 芯片与 Intel）：\`mygo-store-<version>.dmg\`"
            echo "- **Windows**：\`mygo-store-setup-<version>-amd64.exe\` 或 \`-arm64.exe\`"
            echo "- **Linux**：\`.deb\`、\`.tar.gz\`，或 \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sh\`"
            echo
            echo "### 自动更新"
            echo "应用启动后会检查新版本，也可以从菜单「检查更新…」或侧边栏底部的「检查更新」手动检查。下载完成后重启应用即可使用新版本。"
            echo
            echo "### 安装说明"
            echo "- macOS 构建为 ad-hoc 签名；若首次打开被 Gatekeeper 拦截，请在「系统设置 → 隐私与安全性」中允许。"
            echo "- Windows 安装包未签名，SmartScreen 可能提示，选择「更多信息 → 仍要运行」即可。"
            echo "- Linux 使用 Debian 包、归档或 \`install.sh\` 安装。"
            echo
            echo "### 变更"
            if [ -n "$previous" ]; then
              git log --no-merges --pretty=format:'- %s (`%h`)' "$previous..$TAG"
            else
              git log --no-merges --pretty=format:'- %s (`%h`)' "$TAG"
            fi
            echo
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create the draft release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "MyGo Store $TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag \
              --title "MyGo Store $TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

  build:
    needs: prepare
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: darwin/universal
          - name: Windows
            os: ubuntu-latest
            platform: windows/amd64,windows/arm64
          - name: Linux
            os: ubuntu-latest
            platform: linux/amd64,linux/arm64
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set the app version from the tag
        run: |
          python3 - "$TAG" <<'PY'
          import json
          import sys

          version = sys.argv[1][1:]
          with open("mygo.json", encoding="utf-8") as file:
              config = json.load(file)
          config["version"] = version
          with open("mygo.json", "w", encoding="utf-8") as file:
              json.dump(config, file, ensure_ascii=False, indent=2)
              file.write("\n")
          print(f"Building version {version}")
          PY

      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build and upload
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Publish the release
        run: |
          case "$TAG" in
            *-*) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
                    --draft=false --prerelease --latest=false ;;
            *)   gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
                    --draft=false --latest ;;
          esac
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name'

      - name: Summarize
        run: |
          {
            echo "### MyGo Store $TAG"
            echo
            echo '```'
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[] | "\(.size)\t\(.name)"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
